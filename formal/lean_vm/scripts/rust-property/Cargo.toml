# leanVM's production primitives on a line protocol, so that `lake exe rust-property`
# (cli/RustProperty.lean) can set their results beside the Lean definitions' on generated inputs:
# the fields of the verifier and of both prover trees, Keccak-f[1600] one state and many at a time,
# Keccak-256 at once, batched and streamed, and the prover's Fiat-Shamir sponge.
#
# leanVM is this repository (`../../../..`), as for `wire-diff`; `Cargo.lock` is its.
[package]
name = "leanvm-rust-property"
version = "0.0.0"
edition = "2024"
publish = false

# Its own workspace, not a member of leanVM's, whose members still inherit that one's settings.
[workspace]

[dependencies]
verifier = { path = "../../../../crates/verifier" }
keccak256 = { path = "../../../../crates/keccak256" }
fiat_shamir_prover = { path = "../../../../crates/fiat_shamir_prover" }
stable_primitives = { path = "../../../../crates/stable_prover/primitives" }
experimental_primitives = { path = "../../../../crates/experimental_prover/primitives" }

[profile.release]
codegen-units = 1
